# Three members (n1-n3) under test, three fresh members (r1-r3) that a backup
# is restored onto, and the runner. No port is published to the host.
name: dqproof

x-ctl: &ctl
  build: .
  image: dqproof-ctl:local
  init: true
  cap_add: [NET_ADMIN]
  restart: "no"
  mem_limit: 4g

services:
  n1:
    <<: *ctl
    container_name: dqproof-n1
    environment: { NODE: n1, ADDR: "10.213.7.11:9001", LATENCY_MS: "${LATENCY_MS:-0}", SNAP_THRESHOLD: "${SNAP_THRESHOLD:-}", SNAP_TRAILING: "${SNAP_TRAILING:-}" }
    volumes: [./out:/out, n1:/data]
    networks: { net: { ipv4_address: 10.213.7.11 } }
  n2:
    <<: *ctl
    container_name: dqproof-n2
    environment: { NODE: n2, ADDR: "10.213.7.12:9001", JOIN: "10.213.7.11:9001", LATENCY_MS: "${LATENCY_MS:-0}", SNAP_THRESHOLD: "${SNAP_THRESHOLD:-}", SNAP_TRAILING: "${SNAP_TRAILING:-}" }
    volumes: [./out:/out, n2:/data]
    networks: { net: { ipv4_address: 10.213.7.12 } }
  n3:
    <<: *ctl
    container_name: dqproof-n3
    environment: { NODE: n3, ADDR: "10.213.7.13:9001", JOIN: "10.213.7.11:9001", LATENCY_MS: "${LATENCY_MS:-0}", SNAP_THRESHOLD: "${SNAP_THRESHOLD:-}", SNAP_TRAILING: "${SNAP_TRAILING:-}" }
    volumes: [./out:/out, n3:/data]
    networks: { net: { ipv4_address: 10.213.7.13 } }
  r1:
    <<: *ctl
    container_name: dqproof-r1
    environment: { NODE: r1, ADDR: "10.213.7.21:9001", LATENCY_MS: "${LATENCY_MS:-0}", SNAP_THRESHOLD: "${SNAP_THRESHOLD:-}", SNAP_TRAILING: "${SNAP_TRAILING:-}" }
    volumes: [./out:/out, r1:/data]
    networks: { net: { ipv4_address: 10.213.7.21 } }
  r2:
    <<: *ctl
    container_name: dqproof-r2
    environment: { NODE: r2, ADDR: "10.213.7.22:9001", JOIN: "10.213.7.21:9001", LATENCY_MS: "${LATENCY_MS:-0}", SNAP_THRESHOLD: "${SNAP_THRESHOLD:-}", SNAP_TRAILING: "${SNAP_TRAILING:-}" }
    volumes: [./out:/out, r2:/data]
    networks: { net: { ipv4_address: 10.213.7.22 } }
  r3:
    <<: *ctl
    container_name: dqproof-r3
    environment: { NODE: r3, ADDR: "10.213.7.23:9001", JOIN: "10.213.7.21:9001", LATENCY_MS: "${LATENCY_MS:-0}", SNAP_THRESHOLD: "${SNAP_THRESHOLD:-}", SNAP_TRAILING: "${SNAP_TRAILING:-}" }
    volumes: [./out:/out, r3:/data]
    networks: { net: { ipv4_address: 10.213.7.23 } }
  runner:
    image: dqproof-ctl:local
    profiles: [runner]
    entrypoint: ["/usr/local/bin/runner"]
    environment:
      ELECTION_MS: "${ELECTION_MS:-3000}"
      LABEL: "${LABEL:-default}"
      PHASES: "${PHASES:-faults,latency,memory,backup}"
      REV_TRIALS: "${REV_TRIALS:-5}"
      PAUSE_TRIALS: "${PAUSE_TRIALS:-3}"
      CHURN_BATCHES: "${CHURN_BATCHES:-1000}"
      SNAP: "${SNAP_DESC:-}"
    volumes: [./out:/out, /var/run/docker.sock:/var/run/docker.sock]
    networks: { net: { ipv4_address: 10.213.7.5 } }

networks:
  net:
    ipam:
      config: [{ subnet: 10.213.7.0/24 }]

volumes: { n1: {}, n2: {}, n3: {}, r1: {}, r2: {}, r3: {} }
