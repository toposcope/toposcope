# Three members (n1-n3) under test and the runner. CTL=ctlr (with
# BACKEND=rqlite for the runner) runs the rqlite members instead of dqlite. The fresh members a backup
# is restored onto (f1-f3) are created by the runner through the Docker API.
# No port is published to the host.
name: dqproof

x-ctl: &ctl
  build: .
  image: dqproof-ctl:local
  init: true
  cap_add: [NET_ADMIN]
  restart: "no"
  mem_limit: 4g
  entrypoint: ["/usr/local/bin/${CTL:-ctl}"]

services:
  n1:
    <<: *ctl
    container_name: dqproof-n1
    environment: { NODE: n1, ADDR: "10.213.7.11:9001", LATENCY_MS: "${LATENCY_MS:-0}", SNAP_THRESHOLD: "${SNAP_THRESHOLD:-}", SNAP_TRAILING: "${SNAP_TRAILING:-}", TLS: "${TLS:-1}", RQ_JOIN: "10.213.7.11:4002,10.213.7.12:4002,10.213.7.13:4002", RQ_ARGS: "${RQ_ARGS:-}", MTLS: "${MTLS:-0}", CERT_SET: a }
    volumes: [./out:/out, n1:/data]
    networks: { net: { ipv4_address: 10.213.7.11 } }
  n2:
    <<: *ctl
    container_name: dqproof-n2
    environment: { NODE: n2, ADDR: "10.213.7.12:9001", JOIN: "10.213.7.11:9001", LATENCY_MS: "${LATENCY_MS:-0}", SNAP_THRESHOLD: "${SNAP_THRESHOLD:-}", SNAP_TRAILING: "${SNAP_TRAILING:-}", TLS: "${TLS:-1}", RQ_JOIN: "10.213.7.11:4002,10.213.7.12:4002,10.213.7.13:4002", RQ_ARGS: "${RQ_ARGS:-}", MTLS: "${MTLS:-0}", CERT_SET: a }
    volumes: [./out:/out, n2:/data]
    networks: { net: { ipv4_address: 10.213.7.12 } }
  n3:
    <<: *ctl
    container_name: dqproof-n3
    environment: { NODE: n3, ADDR: "10.213.7.13:9001", JOIN: "10.213.7.11:9001", LATENCY_MS: "${LATENCY_MS:-0}", SNAP_THRESHOLD: "${SNAP_THRESHOLD:-}", SNAP_TRAILING: "${SNAP_TRAILING:-}", TLS: "${TLS:-1}", RQ_JOIN: "10.213.7.11:4002,10.213.7.12:4002,10.213.7.13:4002", RQ_ARGS: "${RQ_ARGS:-}", MTLS: "${MTLS:-0}", CERT_SET: a }
    volumes: [./out:/out, n3:/data]
    networks: { net: { ipv4_address: 10.213.7.13 } }
  runner:
    image: dqproof-ctl:local
    profiles: [runner]
    entrypoint: ["/usr/local/bin/runner"]
    environment:
      ELECTION_MS: "${ELECTION_MS:-3000}"
      LABEL: "${LABEL:-default}"
      PHASES: "${PHASES:-faults,latency,memory,backup}"
      REV_TRIALS: "${REV_TRIALS:-3}"
      PAUSE_TRIALS: "${PAUSE_TRIALS:-3}"
      CHURN_BATCHES: "${CHURN_BATCHES:-1000}"
      SNAP: "${SNAP_DESC:-}"
      REV_MODES: "${REV_MODES:-partition,partition+cpu,pause+partition,asym-in,asym-out}"
      BUDGET_ROUNDS: "${BUDGET_ROUNDS:-12}"
      HOST_OUT: "${HOST_OUT}"
      LATENCY_MS: "${LATENCY_MS:-0}"
      SNAP_THRESHOLD: "${SNAP_THRESHOLD:-}"
      SNAP_TRAILING: "${SNAP_TRAILING:-}"
      TLS: "${TLS:-1}"
      BACKEND: "${BACKEND:-dqlite}"
      RQ_ARGS: "${RQ_ARGS:-}"
      MTLS: "${MTLS:-0}"
      SNAPSTALL_TRIALS: "${SNAPSTALL_TRIALS:-5}"
      SNAPSTALL_MODES: "${SNAPSTALL_MODES:-asym-in,pause,kill}"
      SNAPSTALL_WAIT_S: "${SNAPSTALL_WAIT_S:-300}"
      SNAPSTALL_RATE: "${SNAPSTALL_RATE:-2mbit}"
    volumes: [./out:/out, /var/run/docker.sock:/var/run/docker.sock]
    networks: { net: { ipv4_address: 10.213.7.5 } }

networks:
  net:
    ipam:
      config: [{ subnet: 10.213.7.0/24 }]

volumes: { n1: {}, n2: {}, n3: {} }
