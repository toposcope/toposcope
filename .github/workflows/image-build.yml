name: Image build

# The release workflow runs only on a tag. This builds the same image for the
# same platforms, without pushing, when a pull request touches what it is built from.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - bun.lock
      - .github/workflows/image-build.yml
      - .github/workflows/release-image.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
