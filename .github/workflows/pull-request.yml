name: Pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLICKHOUSE_URL: http://127.0.0.1:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: toposcope
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: toposcope
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user default --password toposcope --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Typecheck
        run: bun run typecheck
