name: Pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLICKHOUSE_URL: http://127.0.0.1:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: toposcope
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: toposcope
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user default --password toposcope --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Typecheck
        run: bun run typecheck

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLICKHOUSE_URL: http://127.0.0.1:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: toposcope
      SQLITE_PATH: ${{ github.workspace }}/e2e.sqlite
      TOPOSCOPE_DEV: "1"
      TOPOSCOPE_INGEST_TOKEN: e2e-ingest-test
      TOPOSCOPE_URL: http://127.0.0.1:8080
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: toposcope
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user default --password toposcope --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the UI
        run: bun run build:ui
      - name: Start the app
        run: |
          PORT=8080 HOST=127.0.0.1 nohup bun run src/index.ts > app.log 2>&1 &
          curl -fsS --retry 60 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/api/health
      - name: e2e
        run: bun run e2e
      - name: App log
        if: failure()
        run: tail -200 app.log

  e2e-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOPOSCOPE_DEV: "1"
      TOPOSCOPE_INGEST_TOKEN: e2e-ingest-test
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: toposcope
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user default --password toposcope --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Start five instances
        # One ClickHouse database and one SQLite file each; an Owner token for each goes to $GITHUB_ENV.
        run: |
          for spec in a:28080 b:28085 edge:28180 region:28185 centre:28190; do
            name=${spec%%:*}; port=${spec##*:}
            curl -fsS -u default:toposcope http://127.0.0.1:8123/ --data-binary "CREATE DATABASE tp_$name"
            PORT=$port HOST=127.0.0.1 OTLP_GRPC_PORT=$((port+1000)) SYSLOG_UDP_PORT=$((port+2000)) \
              SQLITE_PATH=$PWD/$name.sqlite CLICKHOUSE_URL="http://127.0.0.1:8123/?database=tp_$name" \
              CLICKHOUSE_USER=default CLICKHOUSE_PASSWORD=toposcope \
              nohup bun run src/index.ts > $name.log 2>&1 &
          done
          for spec in a:28080 b:28085 edge:28180 region:28185 centre:28190; do
            name=${spec%%:*}; port=${spec##*:}
            curl -fsS --retry 60 --retry-delay 1 --retry-all-errors http://127.0.0.1:$port/api/health > /dev/null
            token=$(SQLITE_PATH=$PWD/$name.sqlite bun run src/cli.ts service-token e2e owner)
            echo "::add-mask::$token"
            echo "TOPOSCOPE_TOKEN_$(echo $name | tr a-z A-Z)=$token" >> "$GITHUB_ENV"
          done
      - name: e2e:links
        env:
          LINKS_A_URL: http://127.0.0.1:28080
          LINKS_B_URL: http://127.0.0.1:28085
        run: bun run e2e:links
      - name: e2e:tiers
        env:
          TIERS_EDGE_URL: http://127.0.0.1:28180
          TIERS_REGION_URL: http://127.0.0.1:28185
          TIERS_CENTRE_URL: http://127.0.0.1:28190
        run: bun run e2e:tiers
      - name: App logs
        if: failure()
        run: tail -n 80 a.log b.log edge.log region.log centre.log
