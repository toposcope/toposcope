global:
  scrape_interval: 5s
scrape_configs:
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
remote_write:
  - url: http://host.docker.internal:39999/api/v1/write
    metadata_config: { send: true, send_interval: 10s }
