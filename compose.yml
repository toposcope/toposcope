# Packaged install. Pin matches package.json.
# Fill .env (see .env.example), then: docker compose up -d
# Before the GitHub release exists: docker build -t ghcr.io/toposcope/toposcope:0.4.0 .
# Do not put passwords in this file. ClickHouse is not published.
# bun run load:10m / 100m needs compose.dev.yml resource limits, not these.

name: toposcope

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: default
    volumes:
      - ch_data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'clickhouse-client --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    restart: unless-stopped

  app:
    image: ghcr.io/toposcope/toposcope:0.4.0
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5514:5514/udp"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      SYSLOG_UDP_PORT: "5514"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      SQLITE_PATH: /data/toposcope.sqlite
      TOPOSCOPE_PASSWORD: ${TOPOSCOPE_PASSWORD:?Set TOPOSCOPE_PASSWORD in .env}
      TOPOSCOPE_INGEST_TOKEN: ${TOPOSCOPE_INGEST_TOKEN:?Set TOPOSCOPE_INGEST_TOKEN in .env}
    volumes:
      - app_data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:8080/api/health'); if (!r.ok) process.exit(1);",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

volumes:
  ch_data:
  app_data:
