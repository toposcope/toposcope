# Packaged install. Pin matches package.json.
# Fill .env (see .env.example), then: docker compose up -d
# Before the GitHub release exists: docker build -t ghcr.io/toposcope/toposcope:0.11.0 .
# Do not put passwords in this file. ClickHouse is not published.
# bun run load:10m / 100m needs compose.dev.yml resource limits, not these.

name: toposcope

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: default
    volumes:
      - ch_data:/var/lib/clickhouse
    configs:
      - source: clickhouse_logs
        target: /etc/clickhouse-server/config.d/toposcope-logs.xml
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'clickhouse-client --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    restart: unless-stopped

  app:
    image: ghcr.io/toposcope/toposcope:0.11.0
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5514:5514/udp"
      - "127.0.0.1:4319:4319"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      SYSLOG_UDP_PORT: "5514"
      OTLP_GRPC_PORT: "4319"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      SQLITE_PATH: /data/toposcope.sqlite
      # Imported once into Access as the ingest token "env (imported)", then never read again.
      TOPOSCOPE_INGEST_TOKEN: ${TOPOSCOPE_INGEST_TOKEN:-}
      # Optional: the address people open Toposcope at, so alerts can link back.
      TOPOSCOPE_PUBLIC_URL: ${TOPOSCOPE_PUBLIC_URL:-}
      # Optional: a check-in somewhere else after each monitor pass (docs/operations.md).
      TOPOSCOPE_WATCHDOG_URL: ${TOPOSCOPE_WATCHDOG_URL:-}
      # On by default: a daily look at GitHub's releases list; off makes no call.
      TOPOSCOPE_UPDATE_CHECK: ${TOPOSCOPE_UPDATE_CHECK:-}
    volumes:
      - app_data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:8080/api/health'); if (!r.ok) process.exit(1);",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

volumes:
  ch_data:
  app_data:

# ClickHouse's own logging, which out of the box fills the data volume with system tables
# Toposcope never reads (text_log at trace level alone grows by gigabytes a week). The server
# logs warnings and up; the high-volume system logs are off; the ones kept live 7 days.
# Toposcope reads none of these logs (docs/operations.md, ClickHouse's own logs). Needs Compose
# 2.23.1 or later.
configs:
  clickhouse_logs:
    content: |
      <clickhouse>
        <logger>
          <level>warning</level>
          <size>100M</size>
          <count>3</count>
        </logger>
        <text_log remove="1"/>
        <trace_log remove="1"/>
        <processors_profile_log remove="1"/>
        <query_views_log remove="1"/>
        <query_thread_log remove="1"/>
        <query_metric_log remove="1"/>
        <metric_log remove="1"/>
        <asynchronous_metric_log remove="1"/>
        <part_log remove="1"/>
        <background_schedule_pool_log remove="1"/>
        <opentelemetry_span_log remove="1"/>
        <query_log>
          <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </query_log>
        <error_log>
          <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </error_log>
        <asynchronous_insert_log>
          <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </asynchronous_insert_log>
      </clickhouse>
