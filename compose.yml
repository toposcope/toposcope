# Packaged install. Pin matches package.json.
# Fill .env (see .env.example), then: docker compose up -d
# Before the GitHub release exists: docker build -t ghcr.io/toposcope/toposcope:0.11.1 .
# Do not put passwords in this file. ClickHouse is not published.
# bun run load:10m / 100m needs compose.dev.yml resource limits, not these.

name: toposcope

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: default
    volumes:
      - ch_data:/var/lib/clickhouse
    # Sizes ClickHouse from the CPUs and memory it may use, at every start (configs below).
    entrypoint: ["/bin/bash", "/toposcope-size.sh"]
    configs:
      - source: clickhouse_logs
        target: /etc/clickhouse-server/config.d/toposcope-logs.xml
      - source: clickhouse_size
        target: /toposcope-size.sh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'clickhouse-client --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          # Unset, there is no cap: ClickHouse takes half the machine's memory at most and sizes
          # itself to that. Set them in .env (CLICKHOUSE_MEMORY=4G) to give it less; 0 is no cap.
          cpus: "${CLICKHOUSE_CPUS:-0}"
          memory: ${CLICKHOUSE_MEMORY:-0}
    restart: unless-stopped

  app:
    image: ghcr.io/toposcope/toposcope:0.11.1
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5514:5514/udp"
      - "127.0.0.1:4319:4319"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      SYSLOG_UDP_PORT: "5514"
      OTLP_GRPC_PORT: "4319"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      SQLITE_PATH: /data/toposcope.sqlite
      # Imported once into Access as the ingest token "env (imported)", then never read again.
      TOPOSCOPE_INGEST_TOKEN: ${TOPOSCOPE_INGEST_TOKEN:-}
      # Optional: the address people open Toposcope at, so alerts can link back.
      TOPOSCOPE_PUBLIC_URL: ${TOPOSCOPE_PUBLIC_URL:-}
      # Optional: a check-in somewhere else after each monitor pass (docs/operations.md).
      TOPOSCOPE_WATCHDOG_URL: ${TOPOSCOPE_WATCHDOG_URL:-}
      # On by default: a daily look at GitHub's releases list; off makes no call.
      TOPOSCOPE_UPDATE_CHECK: ${TOPOSCOPE_UPDATE_CHECK:-}
    volumes:
      - app_data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:8080/api/health'); if (!r.ok) process.exit(1);",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

volumes:
  ch_data:
  app_data:

# ClickHouse's own logging, which out of the box fills the data volume with system tables
# Toposcope never reads (text_log at trace level alone grows by gigabytes a week). The server
# logs warnings and up; the high-volume system logs are off; the ones kept live 7 days.
# Toposcope reads none of these logs (docs/operations.md, ClickHouse's own logs). Needs Compose
# 2.23.1 or later.
configs:
  clickhouse_logs:
    content: |
      <clickhouse>
        <logger>
          <level>warning</level>
          <size>100M</size>
          <count>3</count>
        </logger>
        <text_log remove="1"/>
        <trace_log remove="1"/>
        <processors_profile_log remove="1"/>
        <query_views_log remove="1"/>
        <query_thread_log remove="1"/>
        <query_metric_log remove="1"/>
        <metric_log remove="1"/>
        <asynchronous_metric_log remove="1"/>
        <part_log remove="1"/>
        <background_schedule_pool_log remove="1"/>
        <opentelemetry_span_log remove="1"/>
        <query_log>
          <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </query_log>
        <error_log>
          <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </error_log>
        <asynchronous_insert_log>
          <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </asynchronous_insert_log>
      </clickhouse>
  clickhouse_size:
    content: |
      #!/bin/bash
      # Sizes ClickHouse from the CPUs and memory this container may use, on every start, then starts it.
      # Out of the box ClickHouse sizes itself for a large shared server: 512 scheduler threads, merge
      # pools of 16 and caches of 5 to 8 GiB each. Here, everything follows the machine instead.
      set -eu
      first() { for f in "$$@"; do [ -r "$$f" ] && { cat "$$f"; return; }; done; echo max; }
      clamp() { local v=$$1; [ "$$v" -lt "$$2" ] && v=$$2; [ "$$v" -gt "$$3" ] && v=$$3; echo "$$v"; }

      # CPUs: the cores this container sees, or fewer when its CPU quota (cgroup v2, then v1) says so.
      cpus=$$(nproc)
      read -r quota period <<<"$$(first /sys/fs/cgroup/cpu.max)"
      if [ "$${quota:-max}" = max ] && [ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then
        quota=$$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us); period=$$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)
        [ "$$quota" -gt 0 ] || quota=max
      fi
      if [ "$${quota:-max}" != max ]; then
        quota_cpus=$$(( (quota + period - 1) / period ))
        [ "$$quota_cpus" -lt "$$cpus" ] && cpus=$$quota_cpus
      fi
      cpus=$$(clamp "$$cpus" 1 1024)

      # Memory: 80% of this container's memory limit when it has one (CLICKHOUSE_MEMORY), else half of
      # the machine's, so the apps beside it keep the rest. Past it, ClickHouse refuses a query (the app
      # answers 429 and senders retry) instead of the kernel killing it.
      host=$$(( $$(awk '/^MemTotal:/ {print $$2}' /proc/meminfo) * 1024 ))
      limit=$$(first /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory/memory.limit_in_bytes)
      if [ "$$limit" != max ] && [ "$$limit" -lt "$$host" ]; then
        budget=$$(( limit / 10 * 8 ))
      else
        budget=$$(( host / 2 ))
      fi

      merges=$$(clamp "$$cpus" 2 16)
      scheduler=$$(clamp $$(( cpus * 4 )) 16 128)
      cat > /etc/clickhouse-server/config.d/toposcope-size.xml <<XML
      <!-- Written by Toposcope at start for $$cpus CPUs and a $$(( budget >> 20 )) MiB budget. Edits are overwritten. -->
      <clickhouse>
        <max_server_memory_usage>$$budget</max_server_memory_usage>
        <mark_cache_size>$$(( budget / 8 ))</mark_cache_size>
        <primary_index_cache_size>$$(( budget / 16 ))</primary_index_cache_size>
        <index_mark_cache_size>$$(( budget / 16 ))</index_mark_cache_size>
        <uncompressed_cache_size>$$(( budget / 16 ))</uncompressed_cache_size>
        <text_index_postings_cache_size>$$(( budget / 16 ))</text_index_postings_cache_size>
        <text_index_tokens_cache_size>$$(( budget / 32 ))</text_index_tokens_cache_size>
        <text_index_header_cache_size>$$(( budget / 32 ))</text_index_header_cache_size>
        <vector_similarity_index_cache_size>0</vector_similarity_index_cache_size>
        <background_pool_size>$$merges</background_pool_size>
        <background_merges_mutations_concurrency_ratio>2</background_merges_mutations_concurrency_ratio>
        <merge_tree>
          <number_of_free_entries_in_pool_to_execute_mutation>$$merges</number_of_free_entries_in_pool_to_execute_mutation>
          <number_of_free_entries_in_pool_to_execute_optimize_entire_partition>$$merges</number_of_free_entries_in_pool_to_execute_optimize_entire_partition>
          <number_of_free_entries_in_pool_to_lower_max_size_of_merge>$$(( (merges + 1) / 2 ))</number_of_free_entries_in_pool_to_lower_max_size_of_merge>
        </merge_tree>
        <background_schedule_pool_size>$$scheduler</background_schedule_pool_size>
        <background_common_pool_size>$$(clamp "$$cpus" 2 8)</background_common_pool_size>
        <background_move_pool_size>1</background_move_pool_size>
        <background_fetches_pool_size>1</background_fetches_pool_size>
        <background_buffer_flush_schedule_pool_size>1</background_buffer_flush_schedule_pool_size>
        <background_message_broker_schedule_pool_size>1</background_message_broker_schedule_pool_size>
        <background_distributed_schedule_pool_size>1</background_distributed_schedule_pool_size>
      </clickhouse>
      XML
      exec /entrypoint.sh "$$@"
